name: PunctuOwlity Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-test-build:
    name: Validate, Test, and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Show Gradle version
        run: gradle --version

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "Checking PunctuOwlity project structure..."

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/src/main/res/layout
          test -d app/src/main/res/values

          echo "Project structure check passed."

      - name: Check Android resources
        shell: bash
        run: |
          set -e

          INVALID_FILES="$(find app/src/main/res \
            -type f \
            \( -name '.gitkeep' -o -name 'git.keep' \) \
            -print)"

          if [ -n "$INVALID_FILES" ]; then
            echo "Invalid placeholder files found under app/src/main/res:"
            echo "$INVALID_FILES"
            exit 1
          fi

          echo "Android resource check passed."

      - name: Validate Android project
        run: python3 scripts/validate_android_project.py

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK was created
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not created at:"
            echo "$APK"
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "APK exists but is empty."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Locate Android build tools
        id: buildtools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "path=$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        run: |
          "${{ steps.buildtools.outputs.path }}/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect APK package information
        shell: bash
        run: |
          "${{ steps.buildtools.outputs.path }}/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk | tee apk-info.txt

      - name: Create APK checksum
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
            | tee apk-sha256.txt

      - name: Create build report
        if: always()
        shell: bash
        run: |
          {
            echo "PunctuOwlity APK Build Report"
            echo "============================"
            echo
            echo "GitHub commit:"
            echo "$GITHUB_SHA"
            echo
            echo "APK:"
            ls -lh app/build/outputs/apk/debug/app-debug.apk 2>/dev/null \
              || echo "APK was not produced."
            echo
            echo "SHA-256:"
            cat apk-sha256.txt 2>/dev/null \
              || echo "Checksum was not produced."
            echo
            echo "Package information:"
            cat apk-info.txt 2>/dev/null \
              || echo "Package information was not produced."
          } > apk-build-report.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: PunctuOwlity-verified-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-build-report.txt
            apk-info.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PunctuOwlity-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
