name: PunctuOwlity Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-test-build:
    name: Validate, Test, and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify required project files
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/src/main/res/layout
          test -d app/src/main/res/values

          echo "Required project files are present."

      - name: Check Android resources
        shell: bash
        run: |
          set -e

          INVALID_FILES="$(find app/src/main/res \
            -type f \
            \( -name '.gitkeep' -o -name 'git.keep' \) \
            -print)"

          if [ -n "$INVALID_FILES" ]; then
            echo "Invalid placeholder files found under app/src/main/res:"
            echo "$INVALID_FILES"
            exit 1
          fi

          echo "Android resources look valid."

      - name: Validate Android project
        run: python3 scripts/validate_android_project.py

      - name: Show Gradle version
        run: gradle --version

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not created:"
            echo "$APK"
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "APK exists but is empty."
            exit 1
          fi

          echo "PunctuOwlity APK successfully created:"
          ls -lh "$APK"

      - name: Upload PunctuOwlity APK
        uses: actions/upload-artifact@v4
        with:
          name: PunctuOwlity-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PunctuOwlity-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
